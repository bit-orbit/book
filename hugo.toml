baseURL = 'https://wiregeek.ir/book/'
languageCode = 'fa'
title = 'Book'
defaultContentLanguage = 'fa'
enableEmoji = true

[languages]
  [languages.fa]
    title = 'Book'
    languageName = 'فارسی'
    languageCode = 'fa-IR'
    weight = 10
    direction = 'rtl'

[module]
  [module.hugoVersion]
    extended = true
    min = "0.100.0"
  [[module.imports]]
    path = "github.com/colinwilson/lotusdocs"
    disable = false
  [[module.imports]]
    path = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"
    disable = false

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.tableOfContents]
    endLevel = 3
    startLevel = 1
  [markup.goldmark.renderer]
    unsafe = true

[params]
  google_fonts = [
    ["Vazirmatn", "300, 400, 500, 600, 700, 800, 900"]
  ]

  sans_serif_font = "Vazirmatn"
  secondary_font  = "Vazirmatn"
  mono_font       = "monospace"

  [params.footer]
    copyright = "توسعه‌یافته برای جامعه مهندسی نرم‌افزار و برنامه‌نویسان 🇮🇷 • انتشار آزاد و منبع‌باز"

  [params.social]
    github = "https://github.com/bit-orbit/book"

  [params.docs]
    title           = "Book"
    themeColor      = "cyan"
    darkMode        = true
    prism           = true
    prismTheme      = "lotusdocs"
    repoURL         = "https://github.com/bit-orbit/book"
    repoBranch      = "master"
    breadcrumbs     = true
    backToTop       = true
    toc             = true
    tocMobile       = true
    scrollSpy       = true
    sidebarIcons    = true

  [params.flexsearch]
    enabled         = true

[menu]
  [[menu.primary]]
    name = "صفحه اصلی"
    url = "/"
    identifier = "home"
    weight = 10
  [[menu.primary]]
    name = "کتاب‌ها"
    url = "/books/"
    identifier = "books"
    weight = 20
  [[menu.primary]]
    name = "مخزن گیت‌هاب"
    url = "https://github.com/bit-orbit/book"
    identifier = "github"
    weight = 30
